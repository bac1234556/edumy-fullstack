project:
  name: edumy-ml-task2-sentiment
  version: "1.0"
  random_seed: 42
  language_scope: english-first

split:
  train: 0.70
  validation: 0.15
  test: 0.15
  stratify: true

features:
  type: tfidf_word
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  max_df: 0.98
  max_features: 100000
  sublinear_tf: true
  lowercase: true
  strip_accents: unicode
  remove_stop_words: false

selection:
  primary_metric: macro_f1
  tie_breakers:
    - neutral_f1
    - weighted_f1
    - simplicity_speed

models:
  required:
    - multinomial_nb
    - logistic_regression
    - linear_svc
    - sgd_log_loss

inference:
  canonical_labels:
    - Negative
    - Neutral
    - Positive
  default_top_k: 3
  empty_input: error
