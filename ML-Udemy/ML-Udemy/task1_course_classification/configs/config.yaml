seed: 42
split:
  train: 0.70
  validation: 0.15
  test: 0.15

text:
  separator: " [SEP] "
  max_features: 80000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.98
  sublinear_tf: true

category:
  models:
    - multinomial_nb
    - logistic_regression
    - linear_svc
  primary_metric: macro_f1

topics:
  min_train_support: 20
  min_train_support_fallback: 10
  max_active_topics: 50
  default_top_k: 5
  models:
    - ovr_logistic_regression
    - ovr_linear_svc
    - ovr_sgd_log_loss
  primary_metric: micro_f1
  tie_breakers:
    - precision_at_5
    - macro_f1
